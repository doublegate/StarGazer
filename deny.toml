# cargo-deny configuration: `cargo deny check`
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory (vulnerability, unmaintained, unsound, yanked).
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained (informational: no vulnerability, no patched
    # version). Time-boxed: removed by the migration to jiff tracked in
    # https://github.com/doublegate/StarGazer/issues/12 (planned for v0.3.2).
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; migration to jiff tracked in #12" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Every license present in the dependency tree as of v0.2.0, all permissive or
# file-level copyleft (MPL-2.0: nucleo-matcher, option-ext) compatible with
# distributing an MIT binary.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
