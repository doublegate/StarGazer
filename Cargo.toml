[package]
name = "stargazer"
version = "0.1.0"
edition = "2021"
description = "TUI browser for your GitHub starred repositories — navigate, search, and open stars instantly"
authors = []

[[bin]]
name = "stargazer"
path = "src/main.rs"

[dependencies]
# TUI framework and terminal backend
ratatui     = "0.30"
crossterm   = { version = "0.29", features = ["event-stream"] }

# Async runtime and HTTP
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.13", features = ["json"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Fuzzy search
fuzzy-matcher = "0.3"

# Open URLs in browser
open = "5"

# XDG data/cache directory resolution
directories = "6"

# Date/time
chrono      = { version = "0.4", features = ["serde"] }

# Error handling
anyhow      = "1"
thiserror   = "1"

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
strip       = "symbols"
