[package]
name = "stargazer"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "TUI browser for your GitHub starred repositories: navigate, search, filter, and open stars instantly"
authors = ["DoubleGate"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/doublegate/StarGazer"
keywords = ["github", "stars", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities"]
publish = false

[lib]
name = "stargazer"
path = "src/lib.rs"

[[bin]]
name = "stargazer"
path = "src/main.rs"

[dependencies]
# TUI framework and terminal backend
# unstable-rendered-line-info: Paragraph::line_count, to clamp README scrolling
# by wrapped height.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }

# Async runtime and HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
reqwest = { version = "0.13", features = ["json"] }
futures = "0.3"

# Serialization and configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
csv = "1"

# Command line
clap = { version = "4", features = ["derive", "env"] }

# Display-width-correct text handling
unicode-width = "0.2"
unicode-segmentation = "1"

# Open URLs in browser, clipboard
open = "5"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

# XDG data/config directory resolution
directories = "6"

# Date/time
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }

# Error handling
anyhow = "1"
thiserror = "2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
